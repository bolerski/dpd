name: Deploy

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      project-name:
        required: true
        type: string

jobs:
  deploy:
    name: Build & Deploy ${{ inputs.env }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload to Cloudflare Pages ${{ inputs.env }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --branch=main --project-name=${{ inputs.project-name }}
