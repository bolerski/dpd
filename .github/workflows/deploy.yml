name: Deploy Astro to Cloudflare

on:
  push:
    branches: [main]

jobs:
  # --------------------------------------------------
  # 1. Automatic Deploy to STAGING
  # --------------------------------------------------
  deploy-staging:
    name: Build & Deploy (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload to Cloudflare Pages (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PROJECT_NAME }}

  # --------------------------------------------------
  # 2. Manual Gate -> Deploy to PRODUCTION
  # --------------------------------------------------
  deploy-production:
    name: Build & Deploy (Production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PROJECT_NAME }}
