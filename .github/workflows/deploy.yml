name: Deploy to astro environment

on:
  push:
    branches: [main]

jobs:
  # --------------------------------------------------
  # 1. Automatic Deploy to STAGING
  # --------------------------------------------------
  deploy-staging:
    uses: ./.github/workflows/astro-deploy.yml
    secrets: inherit
    with:
      env: staging
      project-name: dpd-staging

  # --------------------------------------------------
  # 2. Manual Gate -> Deploy to PRODUCTION
  # --------------------------------------------------
  deploy-production:
    name: Build & Deploy (Production)
    needs: deploy-staging
    uses: ./.github/workflows/astro-deploy.yml
    secrets: inherit
    with:
      env: production
      project-name: dpd
